# remex-dsh-plugin bundle patch — full memory stack for DSH profiles.
#
# Applied after the profile's bundle layers. Override a row by restating every
# key you keep; a patch replaces the row's whole config.

- insert:
    - id: memory
      name: "@your-scope/remex-dsh-plugin/remex-provider"
      config:
        baseUrl: http://localhost:8000
        tenantId: "00000000-0000-4000-8000-000000000001"
        userId: "00000000-0000-4000-8000-000000000002"
        tokenBudget: 512
        limit: 5
        rememberType: semantic
    - id: remex-context-injector
      name: "@your-scope/remex-dsh-plugin/context-injector"
      config:
        enabled: true
        tokenBudget: 512
        limit: 5
        coreMemory:
          enabled: false
          baseUrl: http://localhost:8000
          tenantId: "00000000-0000-4000-8000-000000000001"
          userId: "00000000-0000-4000-8000-000000000002"
    - id: remex-remember
      name: "@your-scope/remex-dsh-plugin/remember"
      config:
        enabled: true
        rememberType: semantic
    - id: tool-memory-search
      name: "@your-scope/remex-dsh-plugin/memory-tools"
      config:
        enabled: true
        tokenBudget: 512
        limit: 5
